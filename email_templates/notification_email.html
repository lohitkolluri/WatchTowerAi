<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchTowerAI Notification</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background-color: #f8f9fa;
      padding: 20px;
      border-bottom: 3px solid #3498db;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      color: #3498db;
    }

    .content {
      padding: 20px;
      background-color: #ffffff;
      border: 1px solid #e9ecef;
      border-radius: 5px;
    }

    .notification-info {
      background-color: #f8f9fa;
      padding: 15px;
      border-left: 4px solid #3498db;
      margin-bottom: 20px;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #6c757d;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>📊 WatchTowerAI Notification</h1>
    </div>

    <div class="content">
      <div class="notification-info">
        <h3>{{ title }}</h3>
        <p>{{ message }}</p>
      </div>

      {% if details %}
      <h3>Details:</h3>
      <pre>{{ details }}</pre>
      {% endif %}
    </div>

    <div class="footer">
      <p>This is an automated notification from WatchTowerAI.</p>
      <p>© {{ timestamp.split(' ')[0] }} WatchTowerAI</p>
    </div>
  </div>
</body>

</html>
